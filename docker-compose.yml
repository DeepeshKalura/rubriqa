name: entry-eval

x-app: &app
  build: .
  image: entry-eval:local
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://entryeval:entryeval@db:5432/entry_eval
    STORAGE_ROOT: /data
  volumes:
    - ./data:/data
    # live source mounts so `docker compose` reflects local edits immediately;
    # the image itself is complete (Dockerfile COPY) and works without them.
    - ./app:/srv/app/app
    - ./scripts:/srv/app/scripts
    - ./tests:/srv/app/tests
    - ./alembic:/srv/app/alembic
    - ./alembic.ini:/srv/app/alembic.ini
    - ./pytest.ini:/srv/app/pytest.ini
    - ./reports:/srv/app/reports
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: entryeval
      POSTGRES_PASSWORD: entryeval
      POSTGRES_DB: entry_eval
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entryeval -d entry_eval"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "127.0.0.1:8090:8000"
    restart: unless-stopped
    # conservative ceilings for a 16 GB office laptop
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  pgdata:
