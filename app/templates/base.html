<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Entry Eval{% endblock %} · Entry Eval</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">EE</div>
      <div>
        <div class="name">Entry Eval</div>
        <div class="sub">local · Hindi + English + Marathi</div>
      </div>
    </div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if active == 'dashboard' }}"><span class="icon">▦</span> Dashboard</a>
      <div class="nav-group">Entry evaluation</div>
      <a href="/programs" class="{{ 'active' if active == 'entries' }}"><span class="icon">◈</span> Programs</a>
      <a href="/entries" class="{{ 'active' if active == 'entries-list' }}"><span class="icon">☷</span> Entries</a>
      <a href="/sandbox" class="{{ 'active' if active == 'sandbox' }}"><span class="icon">↔</span> Sandbox</a>
      <div class="nav-group">System</div>
      <a href="/settings" class="{{ 'active' if active == 'settings' }}"><span class="icon">⚗</span> Settings</a>
    </nav>
  </aside>
  <main class="main">
    {% if flash %}<div class="flash {{ flash_kind or 'info' }}">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
